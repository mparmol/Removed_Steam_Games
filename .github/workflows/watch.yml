name: Vigilancia

# El cron de Actions es MUCHO mas impuntual de lo que parecia. Medido sobre 13
# ejecuciones seguidas de un '*/15': mediana de 49 min entre arranques y un hueco de
# 177 min. Dentro de ese hueco se retiro Astrobuilder y el aviso llego dos horas tarde.
#
# Por eso cada ejecucion hace VARIAS pasadas por su cuenta (ver scripts/vigilar.sh):
# el cron solo tiene que acertar una vez cada tres horas en vez de cada quince minutos.
# Se mantiene el '*/15' porque el grupo de concurrencia descarta lo que sobra y asi la
# siguiente ejecucion entra en cuanto termina la anterior.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Grupo COMPARTIDO con barrido y bootstrap: los tres escriben el mismo asset de
# estado, y si se solapan el ultimo en subir pisa el trabajo del otro sin dar error.
# Saltarse un ciclo de 15 min es inofensivo; perder un bootstrap no.
concurrency:
  group: estado
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    # Tres horas de pasadas + margen. El tope de un job son 6 h.
    timeout-minutes: 200
    outputs:
      ventana_perdida: ${{ steps.ciclo.outputs.ventana_perdida }}
    # El contexto `secrets` NO existe dentro de un `if:` de step (solo `env`), asi que
    # el secret se expone aqui para poder condicionar el paso de notificacion.
    env:
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --omit=dev

      # Recuperar el feed + ciclo + notificar + publicar, repetido cada 15 min
      # mientras dure el job.
      - name: Vigilar
        id: ciclo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR_FEED: feedrepo/feed
          DURACION_MIN: '180'
          INTERVALO_MIN: '15'
        run: bash scripts/vigilar.sh

      # Los logs de Actions dan 403 incluso en repos publicos, asi que el fallo
      # se publica en la rama data para poder diagnosticarlo sin capturas.
      - name: Publicar log si falla
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publicar-log.sh notificar.log ${{ github.workflow }}

  # Si PICS perdio la ventana, el barrido es la unica forma de saber que nos hemos
  # perdido: Steam devuelve listas vacias sin avisar, no da error.
  barrido_de_emergencia:
    needs: ciclo
    if: needs.ciclo.outputs.ventana_perdida == 'true'
    uses: ./.github/workflows/sweep.yml
    with:
      encadenado: true
    permissions:
      contents: write
    secrets: inherit
