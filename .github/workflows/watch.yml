name: Vigilancia

# Cada 15 min. El cron de Actions es impuntual (retrasos de 5-20 min bajo carga),
# asi que la alerta real llega a 15-40 min del hecho. La ventana de PICS es de ~9,5 h,
# de sobra para ese margen.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Grupo COMPARTIDO con barrido y bootstrap: los tres escriben el mismo asset de
# estado, y si se solapan el ultimo en subir pisa el trabajo del otro sin dar error.
# Saltarse un ciclo de 15 min es inofensivo; perder un bootstrap no.
concurrency:
  group: estado
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    outputs:
      ventana_perdida: ${{ steps.ciclo.outputs.ventana_perdida }}
    # El contexto `secrets` NO existe dentro de un `if:` de step (solo `env`), asi que
    # el secret se expone aqui para poder condicionar el paso de notificacion.
    env:
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --omit=dev

      - name: Recuperar el feed publicado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/feed-preparar.sh

      - name: Ejecutar ciclo
        id: ciclo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR_FEED: feedrepo/feed
        run: node src/cli.js watch --remoto

      # ANTES de publicar: el notificador deja constancia de lo enviado en
      # notificados.json y arranque.json, y si se publicara primero esas anotaciones
      # se perderian y se reenviaria todo en cada ciclo.
      # Se salta solo mientras no exista el secret, para que el resto funcione igual.
      - name: Notificar
        if: env.FCM_SERVICE_ACCOUNT != ''
        env:
          DIR_FEED: feedrepo/feed
        run: node src/notificar.js

      - name: Publicar feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/feed-publicar.sh

  # Si PICS perdio la ventana, el barrido es la unica forma de saber que nos hemos
  # perdido: Steam devuelve listas vacias sin avisar, no da error.
  barrido_de_emergencia:
    needs: ciclo
    if: needs.ciclo.outputs.ventana_perdida == 'true'
    uses: ./.github/workflows/sweep.yml
    with:
      encadenado: true
    permissions:
      contents: write
    secrets: inherit
